name: Check
description: Run pre-build checks, build, and test.

inputs:
  base-sha:
    description: Base SHA for the pre-build hook diff range. Empty skips the pre-build.
    default: ''
  mode:
    description: "'presubmit' or 'postsubmit'"

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        BASE_SHA: ${{ inputs.base-sha }}
      run: |
        case "$MODE" in
        postsubmit) ;;
        presubmit)
          [[ -n "$BASE_SHA" ]] || { echo "base-sha is required in presubmit mode"; exit 1; }
          ;;
        *)
          echo "mode must be 'presubmit' or 'postsubmit'"; exit 1
          ;;
        esac

    # For hermetic_cc_toolchain, '/tmp/zig_cache' is specified in .bazelrc.
    # hermetic_cc_toolchain may fail if the cache directory does not exist.
    - name: Ensure /tmp/zig_cache exists
      shell: bash
      run: mkdir -p /tmp/zig_cache

    # Skipped on workflow_dispatch where base-sha is empty.
    - name: Fetch base
      if: ${{ inputs.base-sha != '' }}
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
      run: git fetch --depth=1 origin "$BASE_SHA"

    - name: Restore Bazel repository cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/bazel/repository/
          ~/.cache/bazelisk
        key: bazel-repo-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
        restore-keys: bazel-repo-${{ runner.os }}-

    - name: Restore Bazel disk cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/bazel/disk/
        key: bazel-disk-${{ runner.os }}-${{ github.sha }}
        restore-keys: bazel-disk-${{ runner.os }}-

    - name: Pre-build
      if: ${{ inputs.base-sha != '' }}
      shell: nix develop ./nix#ci --command bash --noprofile --norc -eo pipefail {0}
      env:
        BASE_SHA: ${{ inputs.base-sha }}
      run: |
        prek run --group ci --no-group no-ci --from-ref "$BASE_SHA" --show-diff-on-failure --color=always

    - name: Run Buildifier
      shell: nix develop ./nix#ci --command bash --noprofile --norc -eo pipefail {0}
      run: bazel test //bazel:buildifier_test

    - name: Build
      shell: nix develop ./nix#ci --command bash --noprofile --norc -eo pipefail {0}
      run: bazel build //...

    - name: Test
      shell: nix develop ./nix#ci --command bash --noprofile --norc -eo pipefail {0}
      run: bazel test //...

    # Bazel caches are saved only in postsubmit to prevent short-lived PR
    # branches from polluting caches shared across runs.
    - name: Save Bazel repository cache
      if: ${{ inputs.mode == 'postsubmit' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/bazel/repository/
          ~/.cache/bazelisk
        key: bazel-repo-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}

    - name: Save Bazel disk cache
      if: ${{ inputs.mode == 'postsubmit' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/bazel/disk/
        key: bazel-disk-${{ runner.os }}-${{ github.sha }}
